name: SignalDesk CI
on: [push, pull_request]
jobs:
  node-ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: node-ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: node-ai/package-lock.json }
      - run: npm install
      - run: npm run build
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install
      - run: npm run build
  java-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: java-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B test
